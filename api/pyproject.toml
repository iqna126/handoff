[project]
name = "handoff-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = [".git", "__pycache__", "venv", ".venv"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "C4", "B"]

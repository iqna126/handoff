[project]
name = "handoff-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.27"]

# 这组是 pywrangler 部署工具本身需要的，跟上面 CI 用的 [project.optional-dependencies]
# 是两回事——CI 用 `pip install -e ".[dev]"` 装，不会碰这里；这里给 `uv run pywrangler
# deploy` 用，照抄 cloudflare/python-workers-examples 的 fastapi 示例
[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = [".git", "__pycache__", "venv", ".venv"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "C4", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的 Depends()/Query() 就是要写在参数默认值里，这是框架自己的用法，
# 不是 B008 想抓的那种"函数调用当默认值"的真 bug
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

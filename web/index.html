<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>handoff</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <p id="status">加载中…</p>

    <div id="login" hidden>
      <button id="google-btn" type="button">用 Google 登录</button>
      <hr />
      <form id="email-form">
        <input type="email" id="email-input" placeholder="邮箱" required />
        <button type="submit">发送验证码</button>
      </form>
      <form id="code-form" hidden>
        <input type="text" id="code-input" placeholder="6 位验证码" required />
        <button type="submit">验证</button>
      </form>
    </div>

    <div id="app">
      <main id="main"></main>
      <nav id="nav"></nav>
    </div>
    <button id="logout-btn" type="button" hidden>退出登录</button>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>

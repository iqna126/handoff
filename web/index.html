<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>handoff</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <p id="status">加载中…</p>

    <div id="login" hidden>
      <button id="google-btn" type="button">用 Google 登录</button>
      <hr />
      <form id="email-form">
        <input type="email" id="email-input" placeholder="邮箱" required />
        <button type="submit">发送登录链接</button>
      </form>
      <div id="email-sent" hidden>
        <p>登录链接已发送到 <strong id="email-sent-to"></strong>，去邮箱点击链接即可登录。</p>
        <div class="email-sent-actions">
          <button id="email-resend" type="button">重新发送</button>
          <button id="email-retry" type="button" class="btn-secondary">换个邮箱</button>
        </div>
      </div>
    </div>

    <div id="app">
      <main id="main"></main>
      <nav id="nav"></nav>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>

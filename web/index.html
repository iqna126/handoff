<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>handoff</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <p id="status">加载中…</p>

    <div id="login" hidden>
      <button id="google-btn" type="button">用 Google 登录</button>
      <hr />
      <form id="email-form">
        <input type="email" id="email-input" placeholder="邮箱" required />
        <button type="submit">发送验证码</button>
      </form>
      <form id="code-form" hidden>
        <input type="text" id="code-input" placeholder="6 位验证码" required />
        <button type="submit">验证</button>
      </form>
    </div>

    <div id="denied" hidden>
      <p class="denied-title">这个账号还没有开通</p>
      <p class="denied-sub">handoff 目前只对受邀用户开放。需要开通的话，把下面这串 ID 发给管理员：</p>
      <code id="denied-uid"></code>
      <p class="denied-sub">开通之后刷新页面即可。</p>
      <button id="denied-signout" type="button">退出登录</button>
    </div>

    <div id="app">
      <main id="main"></main>
      <nav id="nav"></nav>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
